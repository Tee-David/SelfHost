name: Bug report
description: Report a reproducible SelfHost problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here. Follow SECURITY.md instead."
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SelfHost version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS/runtime details, but remove secrets, hostnames, IPs and customer data.
